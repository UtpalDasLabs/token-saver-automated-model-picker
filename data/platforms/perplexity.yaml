context_rule: "Web search and fetch tool calls are billed on top of tokens; search once, then reuse the results."
price_notes:
  - "Agent API model prices, which match each provider's direct pricing. Web search and fetch tools are billed separately and not counted."
  - "For quick web-grounded lookups, `perplexity/sonar` is a good T1 alternative because it searches and cites in one call."
default_tool: computer
tools:
  - id: computer
    name: Perplexity Computer
    auto: false
    how: "Import the whole pack as a plugin: Plugins → Add custom → Import plugin from GitHub, and paste the URL of `dist/perplexity/plugin`. Or upload a single skill zip under Plugins → Add custom → Skill. The skill makes Computer plan by tier and keep cheap steps cheap."
    doc: "https://www.perplexity.ai/help-center/en/articles/2026100802-create-or-upload-a-custom-plugin"
  - id: api
    name: Perplexity Agent API
    auto: true
    how: "Upload skills with the Skills API, then set `model` per request from `routing.json`. One API key covers all four tiers across providers."
    doc: "https://docs.perplexity.ai/docs/agent-api/skills"
