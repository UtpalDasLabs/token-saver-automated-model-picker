name: research-analyst-routing
who: "Analysts, consultants, researchers"
title: Research analyst routing
persona: Analysts, consultants, journalists, students and operators who search, read, compare and synthesise many sources.
purpose: Read wide on cheap tiers, think deep on strong ones. Haiku extracts, Sonnet compiles, Opus concludes.
win: Sourced, trustworthy conclusions at a fraction of the cost of reading everything with the top model.
description: "Model routing for research and analysis: which tier searches, reads, extracts, compares, fact-checks and synthesises sources into briefs or reports. Use for market research, literature reviews, due diligence or competitive analysis. Not for numeric data analysis in SQL or spreadsheets."
sessions_per_week: 10
tasks:
  - {task: "Frame the research question and plan", tier: T3, effort: medium, per_week: 2, base_in_k: 10, routed_in_k: 5, out_k: 1.5, p_fail: 0.05, check: "Sub-questions + source types", escalate: "Never above T3"}
  - {task: "Extract facts from each source", tier: T1, effort: low, per_week: 40, base_in_k: 20, routed_in_k: 12, out_k: 0.6, p_fail: 0.08, check: "Each fact has quote + URL", escalate: "Paywalled, scanned or contradictory source -> T2"}
  - {task: "Relevance triage of search results", tier: T1, effort: low, per_week: 10, base_in_k: 15, routed_in_k: 6, out_k: 0.3, p_fail: 0.05, check: "Keep/drop with one reason", escalate: "Never"}
  - {task: "Compile comparison table", tier: T2, effort: medium, per_week: 3, base_in_k: 60, routed_in_k: 15, out_k: 3, p_fail: 0.08, check: "Every cell sourced, gaps marked", escalate: "Sources conflict -> T3"}
  - {task: "Synthesis and conclusions", tier: T3, effort: high, per_week: 2, base_in_k: 80, routed_in_k: 20, out_k: 4, p_fail: 0.05, check: "Claims trace to extracted facts", escalate: "High-stakes decision -> T4 second read"}
  - {task: "Fact-check key claims", tier: T3, effort: medium, per_week: 2, base_in_k: 30, routed_in_k: 10, out_k: 1.5, p_fail: 0.05, check: "Verdict + source per claim", escalate: "Never above T3"}
  - {task: "Summarise long reports or papers", tier: T1, effort: medium, per_week: 8, base_in_k: 50, routed_in_k: 50, out_k: 1, p_fail: 0.08, check: "300 words, section anchors", escalate: "Technical depth needed -> T2"}
  - {task: "Write the final brief from the synthesis", tier: T2, effort: medium, per_week: 2, base_in_k: 40, routed_in_k: 10, out_k: 3, p_fail: 0.05, check: "Matches outline, citations intact", escalate: "Never"}
  - {task: "Citation formatting and link checks", tier: T0, effort: "-", per_week: 3, base_in_k: 15, routed_in_k: 1.5, out_k: 0.3, p_fail: 0.02, check: "All URLs return 200", escalate: "Never"}
  - {task: "Translate a foreign-language source", tier: T2, effort: low, per_week: 2, base_in_k: 15, routed_in_k: 10, out_k: 4, p_fail: 0.05, check: "Names, numbers unchanged", escalate: "Legal text -> T3"}
escalate_now:
  - Claims that will be published, given to investors or used for legal, medical or financial decisions.
  - Sources that directly contradict each other on a key number.
  - The research question itself is fuzzy.
context_diet:
  - Extract facts from each source on T1 into a fixed schema (claim, quote, URL, date); synthesis reads only the fact table.
  - Never paste whole PDFs into the synthesis step.
  - Keep summaries anchored to sections so T3 can pull a raw passage only when needed.
  - "Haiku 5.5 reading long PDFs: split above 100k tokens to stay on the cheaper price band."
tool_first:
  - De-duplicate URLs and sources with a script.
  - Link checks and citation formatting with a reference manager or script.
  - PDF to text with a converter before any model reads it.
anti_patterns:
  - Opus reading 40 sources one by one.
  - Haiku writing the conclusion.
  - Synthesis without a fact table, which makes claims untraceable.
handoff_tip: "Brief T1 extractors with the schema, 'quote verbatim', 'URL required', and 'NONE if not stated'."
example:
  request: "Compare the top 6 EV charging networks in Germany on price, coverage and reliability."
  plan: |
    ROUTING PLAN
    1. [T3] opus/medium    Define criteria, sub-questions, source list
    2. [T1] haiku/low      Triage 60 search results to ~20 sources
    3. [T1] haiku/low      Extract facts per source into schema (batch)
    4. [T2] sonnet/medium  Build comparison table, mark gaps and conflicts
    5. [T3] opus/high      Resolve conflicts, write conclusions
    6. [T2] sonnet/medium  Write the brief from conclusions
    7. [T0] script         Link check all citations
