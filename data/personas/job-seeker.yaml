name: job-seeker-routing
who: "Job seekers and career changers"
title: Job seeker routing
persona: "Professionals searching for a new role: tailoring CVs, writing cover letters, researching companies and preparing interviews."
purpose: Positioning and interview strategy deserve Opus. Matching keywords, formatting and drafting from your own facts are cheaper-tier work.
win: More tailored applications and better-prepared interviews, without burning premium tokens on formatting.
description: "Model routing for job search: which tier positions your story, tailors CVs, writes cover letters, matches keywords, researches companies, preps interviews and drafts follow-ups. Use for applying to jobs or preparing interviews. Not for hiring or recruiting candidates."
sessions_per_week: 8
tasks:
  - {task: "Career positioning and target-role story", tier: T3, effort: high, per_week: 0.5, base_in_k: 30, routed_in_k: 15, out_k: 3, p_fail: 0.05, check: "Headline, 3 proof points, target roles", escalate: "Never above T3"}
  - {task: "Extract requirements from a job ad", tier: T1, effort: low, per_week: 8, base_in_k: 10, routed_in_k: 3, out_k: 0.4, p_fail: 0.05, check: "Must-have vs nice-to-have list", escalate: "Never"}
  - {task: "Tailor CV bullets to the ad", tier: T2, effort: medium, per_week: 6, base_in_k: 20, routed_in_k: 6, out_k: 1.5, p_fail: 0.08, check: "Only facts from master CV", escalate: "Gap needs reframing -> T3"}
  - {task: "Cover letter draft", tier: T2, effort: medium, per_week: 4, base_in_k: 20, routed_in_k: 6, out_k: 1, p_fail: 0.05, check: "Under 300 words, names the company's need", escalate: "Dream role -> T3 edit"}
  - {task: "Company research brief", tier: T2, effort: low, per_week: 3, base_in_k: 30, routed_in_k: 8, out_k: 1, p_fail: 0.08, check: "5 facts with sources", escalate: "Never"}
  - {task: "Interview question prep and STAR answers", tier: T3, effort: medium, per_week: 1, base_in_k: 25, routed_in_k: 10, out_k: 3, p_fail: 0.05, check: "Answers use real stories, under 2 minutes each", escalate: "Never above T3"}
  - {task: "Mock interview feedback", tier: T3, effort: medium, per_week: 1, base_in_k: 15, routed_in_k: 8, out_k: 1.5, p_fail: 0.05, check: "3 fixes per answer", escalate: "Never above T3"}
  - {task: "Follow-up and thank-you emails", tier: T1, effort: low, per_week: 3, base_in_k: 8, routed_in_k: 2, out_k: 0.3, p_fail: 0.05, check: "Under 120 words", escalate: "Negotiation -> T3"}
  - {task: "Application tracker updates", tier: T0, effort: "-", per_week: 4, base_in_k: 8, routed_in_k: 1.5, out_k: 0.3, p_fail: 0.02, check: "Sheet row added", escalate: "Never"}
  - {task: "Salary negotiation prep", tier: T3, effort: high, per_week: 0.2, base_in_k: 20, routed_in_k: 10, out_k: 2, p_fail: 0.05, check: "Range, anchors, walk-away", escalate: "Never above T3"}
escalate_now:
  - Salary and offer negotiation.
  - Final applications for roles you care most about.
  - Explaining career gaps or role changes.
context_diet:
  - Keep one master CV and one proof-points file; send the relevant bullets, not the whole history.
  - Extract the ad's requirements on T1 first; the tailoring step reads only that list.
  - Never paste the full company website; send the research brief.
tool_first:
  - Application tracking in a sheet with formulas for follow-up dates.
  - PDF export and formatting with a template, not a model.
  - Keyword overlap counts with a script.
anti_patterns:
  - Opus reformatting a CV.
  - Letting any model invent achievements not in the master CV.
  - Rewriting the whole CV for every application instead of swapping bullets.
handoff_tip: "Brief T2 with the extracted requirements, the master bullets and 'only reword facts given; no new claims'."
example:
  request: "Apply to this Head of Product role at a mobility company: tailor my CV, write the letter, and prep me for the interview."
  plan: |
    ROUTING PLAN
    1. [T1] haiku/low      Extract must-haves and nice-to-haves from the ad
    2. [T2] sonnet/low     Company research brief
    3. [T2] sonnet/medium  Tailor CV bullets from the master CV
    4. [T2] sonnet/medium  Cover letter draft
    5. [T3] opus/medium    Edit letter + check positioning (dream role)
    6. [T3] opus/medium    Likely questions + STAR answers from real stories
    7. [T0] sheet          Log application, set follow-up date
