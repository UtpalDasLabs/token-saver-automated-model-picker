name: sales-bd-routing
who: "Sales and business development"
title: Sales and BD routing
persona: Account executives, SDRs, founders doing sales and business developers researching accounts and writing outreach.
purpose: Account strategy and the high-value deal deserve {T3}. List enrichment, first-line personalisation and CRM hygiene do not.
win: More qualified meetings per week at a lower AI cost per meeting booked.
description: "Model routing for sales and business development: which tier researches accounts, enriches leads, personalises outreach, writes sequences, preps calls, summarises calls and updates CRM. Use for prospecting, outreach or deal work. Not for marketing campaigns or ads."
sessions_per_week: 15
tasks:
  - {task: "Account strategy for a key deal", tier: T3, effort: high, per_week: 1, base_in_k: 40, routed_in_k: 15, out_k: 3, p_fail: 0.05, check: "Stakeholders, pains, plan, risks", escalate: "Never above T3"}
  - {task: "Lead qualification against ICP", tier: T1, effort: low, per_week: 10, base_in_k: 15, routed_in_k: 5, out_k: 0.8, p_fail: 0.08, check: "Fit score + reason per lead", escalate: "Borderline enterprise leads -> T2"}
  - {task: "Account research summary", tier: T2, effort: low, per_week: 10, base_in_k: 30, routed_in_k: 8, out_k: 1, p_fail: 0.08, check: "5 facts with sources", escalate: "Never"}
  - {task: "Personalised first lines", tier: T1, effort: medium, per_week: 10, base_in_k: 15, routed_in_k: 4, out_k: 1, p_fail: 0.08, check: "References one real fact", escalate: "Top-20 accounts -> T2"}
  - {task: "Outreach sequence templates", tier: T2, effort: medium, per_week: 1, base_in_k: 20, routed_in_k: 6, out_k: 3, p_fail: 0.05, check: "Under 90 words, one ask", escalate: "Never"}
  - {task: "Call prep brief", tier: T2, effort: medium, per_week: 6, base_in_k: 25, routed_in_k: 8, out_k: 1.2, p_fail: 0.05, check: "Agenda, questions, objections", escalate: "Strategic deal -> T3"}
  - {task: "Call summary and next steps", tier: T1, effort: low, per_week: 10, base_in_k: 20, routed_in_k: 15, out_k: 0.6, p_fail: 0.05, check: "MEDDICC-style fields filled", escalate: "Never"}
  - {task: "CRM field updates and dedupe", tier: T0, effort: "-", per_week: 5, base_in_k: 15, routed_in_k: 1.5, out_k: 0.3, p_fail: 0.02, check: "API write log", escalate: "Never"}
  - {task: "Objection handling and negotiation prep", tier: T3, effort: medium, per_week: 2, base_in_k: 20, routed_in_k: 8, out_k: 1.5, p_fail: 0.05, check: "Response per objection + walk-away", escalate: "Never above T3"}
  - {task: "Proposal draft", tier: T2, effort: medium, per_week: 1, base_in_k: 30, routed_in_k: 10, out_k: 4, p_fail: 0.05, check: "Pricing from the price sheet only", escalate: "Custom pricing or terms -> T3 review"}
escalate_now:
  - Pricing, discounts, contract terms or legal language.
  - Replies to an angry or churning customer.
  - Enterprise deals above your team's normal deal size.
context_diet:
  - Enrich leads from structured fields (company, role, size, one recent signal), not full web pages.
  - Summarise call transcripts on T1 into a fixed template; later steps use only the summary.
  - Keep a stable ICP and value-prop card as the first block of every batch.
tool_first:
  - Dedupe, normalise and update CRM fields via import or API scripts.
  - Email verification and bounce checks with a verification tool.
  - Sequencing and scheduling in the sales tool, not via a model.
anti_patterns:
  - "{T3} writing 200 first lines."
  - Pasting whole LinkedIn profiles into every personalisation call.
  - Model-generated pricing without the price sheet.
handoff_tip: "Brief T1 with the ICP card, the lead's 4 fields and 'one sentence, must reference one fact from input'."
example:
  request: "Find and prioritise 100 Berlin mobility startups, then draft outreach for the top 20."
  plan: |
    ROUTING PLAN
    1. [T0] script         Pull list, dedupe, verify emails
    2. [T1] haiku/low      ICP fit score per company (batch of 50)
    3. [T2] sonnet/low     Research summary for top 20
    4. [T2] sonnet/medium  Personalised first line + 3-step sequence for top 20
    5. [T3] opus/medium    Review the 5 biggest accounts' messages
    6. [T0] script         Push to CRM
